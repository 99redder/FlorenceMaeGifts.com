<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Emergency Sign-In | Florence Mae Gifts</title>
  <link rel="icon" href="images/favicon.png" />
  <link rel="stylesheet" href="./fmg.css" />
  <style>
    html { min-height:100%; }
    body {
      min-height:100vh;
      min-height:100svh;
      width:100%;
      max-width:none;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0;
      padding:2rem 1rem;
      box-sizing:border-box;
      background:#f7f1ea;
      color:#3d2b24;
      font-family:Arial, sans-serif;
    }
    .login-card { width:min(92vw, 440px); margin:auto; background:#fffaf5; border:1px solid rgba(90,61,49,.18); border-radius:18px; box-shadow:0 18px 50px rgba(61,43,36,.12); overflow:hidden; }
    .login-card img { width:100%; aspect-ratio:32/9; object-fit:cover; display:block; border-bottom:1px solid rgba(90,61,49,.14); }
    form { padding:1.5rem; display:flex; flex-direction:column; gap:.9rem; }
    h1 { font-size:1.5rem; margin:.1rem 0 .2rem; }
    p { margin:0; line-height:1.45; font-size:.95rem; }
    label { font-size:.9rem; font-weight:700; }
    input { width:100%; box-sizing:border-box; border:1px solid rgba(90,61,49,.28); border-radius:10px; padding:.75rem .85rem; font-size:1rem; background:white; }
    button { border:0; border-radius:999px; padding:.85rem 1rem; background:#7a4e3a; color:white; font-weight:700; cursor:pointer; }
    button.link { background:none; color:#7a4e3a; padding:.2rem; text-decoration:underline; font-weight:400; }
    button:disabled { opacity:.65; cursor:wait; }
    .hint { font-size:.8rem; color:#715b51; margin-top:.3rem; }
    .error { min-height:1.2rem; color:#b42318; font-size:.92rem; }
    .ok { color:#256c3a; font-size:.92rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <section class="login-card" aria-labelledby="em-title">
    <img src="./images/banner3.png" alt="Florence Mae Gifts" />
    <form id="em-form" novalidate>
      <h1 id="em-title">Emergency Sign-In</h1>
      <p id="em-intro">Checking…</p>

      <div id="step-password" hidden>
        <label for="em-pass">Your password</label>
        <input id="em-pass" type="password" autocomplete="current-password" />
      </div>

      <div id="em-turnstile" hidden></div>
      <button id="send-btn" type="button" hidden>Email me a code</button>

      <div id="step-code" hidden>
        <p class="ok" id="sent-msg"></p>
        <label for="em-code">6-digit code from the email</label>
        <input id="em-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="123456" />
      </div>

      <div id="step-new" hidden>
        <label for="em-new">Choose a password</label>
        <input id="em-new" type="password" autocomplete="new-password" />
        <div class="hint">At least 12 characters. A short sentence is easy to remember, for example "Ellie loves blue yarn".</div>
        <label for="em-new2" style="display:block;margin-top:.7rem">Type it again</label>
        <input id="em-new2" type="password" autocomplete="new-password" />
      </div>

      <button id="verify-btn" type="submit" hidden>Sign in</button>
      <div class="error" id="em-error" role="alert"></div>
      <button id="reset-btn" class="link" type="button" hidden>Forgot your password? Set a new one</button>
      <a href="./admin-login.html" style="font-size:.85rem;color:#715b51;text-align:center">Back to the normal admin login</a>
    </form>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);
    const errorEl = $('em-error');
    let mode = 'login'; // 'login' (password + code) or 'setup' (code + new password)

    // Turnstile widget above "Email me a code". Each token works once, so the widget is
    // reset after every request; renderTurnstile runs when the script or the form is ready.
    const TURNSTILE_SITEKEY = '0x4AAAAAAFnNlSgwL9V46Urf';
    let turnstileWidgetId = null;
    function renderTurnstile() {
      if (turnstileWidgetId !== null || !window.turnstile || $('em-turnstile').hidden) return;
      turnstileWidgetId = window.turnstile.render('#em-turnstile', { sitekey: TURNSTILE_SITEKEY, action: 'emergency_code', theme: 'light' });
    }
    window.onTurnstileLoad = renderTurnstile;

    function show(id, on) { $(id).hidden = !on; }
    function setMode(next, hasAccount) {
      mode = next;
      $('em-intro').textContent = mode === 'setup'
        ? (hasAccount
            ? 'We will email a code to your address. Then choose a new password.'
            : 'This sets up your own sign-in to the shop admin. We will email a code to your address, then you choose a password.')
        : 'Type your password, then we will email you a code to finish signing in.';
      show('step-password', mode === 'login');
      show('em-turnstile', true);
      show('send-btn', true);
      renderTurnstile();
      show('reset-btn', mode === 'login');
      show('step-code', false); show('step-new', false); show('verify-btn', false);
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: body ? 'POST' : 'GET',
        credentials: 'same-origin',
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    fetch('/api/admin/verify-session', { credentials: 'same-origin' })
      .then((res) => { if (res.ok) window.location.href = './admin.html'; })
      .catch(() => {});

    api('/api/admin/emergency/status').then(({ data }) => {
      if (!data.configured) { $('em-intro').textContent = 'Emergency sign-in is not turned on yet.'; return; }
      setMode(data.hasAccount ? 'login' : 'setup', data.hasAccount);
    }).catch(() => { $('em-intro').textContent = 'Could not reach the server. Check the internet connection and reload.'; });

    $('reset-btn').addEventListener('click', () => { errorEl.textContent = ''; setMode('setup', true); });

    $('send-btn').addEventListener('click', async () => {
      errorEl.textContent = '';
      const turnstileToken = turnstileWidgetId !== null ? window.turnstile.getResponse(turnstileWidgetId) : '';
      if (!turnstileToken) { errorEl.textContent = 'Wait a moment for the security check above to finish, then try again.'; return; }
      $('send-btn').disabled = true;
      try {
        const { res, data } = await api('/api/admin/emergency/request', mode === 'setup' ? { reset: true, turnstileToken } : { password: $('em-pass').value, turnstileToken });
        if (!res.ok) { errorEl.textContent = data.error || 'Something went wrong. Try again.'; return; }
        $('sent-msg').textContent = `We emailed a code to ${data.sentTo}. It works for 15 minutes.`;
        show('step-code', true);
        show('step-new', data.purpose === 'setup');
        show('verify-btn', true);
        $('verify-btn').textContent = data.purpose === 'setup' ? 'Save password and sign in' : 'Sign in';
        $('send-btn').textContent = 'Send a new code';
        $('em-code').focus();
      } catch {
        errorEl.textContent = 'Could not reach the server. Try again.';
      } finally {
        window.turnstile.reset(turnstileWidgetId);
        $('send-btn').disabled = false;
      }
    });

    $('em-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      if ($('verify-btn').hidden) { $('send-btn').click(); return; }
      const settingUp = !$('step-new').hidden;
      if (settingUp) {
        if ($('em-new').value.length < 12) { errorEl.textContent = 'Choose a password of at least 12 characters.'; return; }
        if ($('em-new').value !== $('em-new2').value) { errorEl.textContent = 'The two passwords are different.'; return; }
      }
      $('verify-btn').disabled = true;
      try {
        const { res, data } = await api('/api/admin/emergency/verify', { code: $('em-code').value.replace(/\D/g, ''), newPassword: settingUp ? $('em-new').value : undefined });
        if (res.ok) { window.location.href = './admin.html'; return; }
        errorEl.textContent = data.error || 'Something went wrong. Try again.';
      } catch {
        errorEl.textContent = 'Could not reach the server. Try again.';
      } finally {
        $('verify-btn').disabled = false;
      }
    });
  </script>
  <!-- Cloudflare Turnstile (after the script above, so onTurnstileLoad exists): the worker refuses to email a code without a passed check -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</body>
</html>
